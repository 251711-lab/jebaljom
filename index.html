
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공연장 지도 | Stage Finder</title>

  <!-- 카카오 지도 SDK와 장소 검색 라이브러리 불러오기 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=11a56469b67306e63016649e688605c8&libraries=services&autoload=false"></script>

  <style>
    /* 전체 화면 기본 설정 */
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #242424;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* 왼쪽 패널과 오른쪽 지도 배치 */
    .app {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* 왼쪽 공연장 검색 패널 */
    .sidebar {
      width: 390px;
      min-width: 330px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-right: 1px solid #e6e6e6;
      z-index: 2;
    }

    .header {
      padding: 22px 20px 16px;
      background: #191923;
      color: white;
    }

    .eyebrow {
      margin-bottom: 8px;
      color: #c5b5ff;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .header p {
      margin: 0;
      color: #d0d0d9;
      font-size: 12px;
      line-height: 1.6;
    }

    /* 공연장 유형 탭 */
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      padding: 14px 14px 10px;
    }

    .tab {
      padding: 12px 4px;
      border: 1px solid #e5e5ec;
      border-radius: 10px;
      background: #fff;
      color: #555;
      font-size: 13px;
      font-weight: bold;
      transition: 0.15s;
    }

    .tab .tab-icon {
      display: block;
      margin-bottom: 5px;
      font-size: 21px;
    }

    .tab .tab-size {
      display: block;
      margin-top: 4px;
      font-size: 10px;
      font-weight: normal;
      color: #888;
    }

    .tab.active {
      background: #f0edff;
      border-color: #7861df;
      color: #5941c5;
    }

    /* 공연장 유형을 설명하는 이미지 영역 */
    .category-visual {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 4px 14px 12px;
      padding: 13px;
      border-radius: 12px;
      background: #f7f6fb;
    }

    .category-art {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      flex-shrink: 0;
      border-radius: 10px;
      font-size: 36px;
    }

    .category-art.small {
      background: #eee8ff;
    }

    .category-art.medium {
      background: #e2f4ff;
    }

    .category-art.large {
      background: #ffebdf;
    }

    .category-description {
      font-size: 12px;
      line-height: 1.6;
      color: #666;
    }

    .category-description strong {
      display: block;
      margin-bottom: 3px;
      color: #272333;
      font-size: 14px;
    }

    /* 검색창 */
    .search-form {
      display: flex;
      gap: 7px;
      padding: 0 14px 13px;
    }

    #searchInput {
      flex: 1;
      width: 0;
      min-width: 0;
      padding: 11px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 13px;
    }

    #searchInput:focus {
      border-color: #7861df;
    }

    #searchButton {
      padding: 0 14px;
      border: 0;
      border-radius: 8px;
      background: #7861df;
      color: white;
      font-weight: bold;
      font-size: 13px;
    }

    #searchButton:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    /* 현재 위치 및 검색 상태 */
    .status {
      padding: 11px 17px;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
      background: #fafafa;
      font-size: 12px;
      line-height: 1.6;
      color: #666;
    }

    /* 검색 결과 목록 */
    .results {
      flex: 1;
      overflow-y: auto;
    }

    .result-count {
      padding: 14px 17px 8px;
      font-size: 12px;
      color: #777;
    }

    .result-item {
      display: flex;
      gap: 11px;
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .result-item:hover,
    .result-item.selected {
      background: #f7f5ff;
    }

    .result-marker {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 39px;
      height: 39px;
      flex-shrink: 0;
      border-radius: 12px;
      font-size: 20px;
    }

    .result-marker.small {
      background: #eee8ff;
    }

    .result-marker.medium {
      background: #e2f4ff;
    }

    .result-marker.large {
      background: #ffebdf;
    }

    .result-info {
      min-width: 0;
      flex: 1;
    }

    .result-name {
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.4;
    }

    .result-address {
      font-size: 11px;
      line-height: 1.6;
      color: #777;
      overflow-wrap: anywhere;
    }

    .result-capacity {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 6px;
      border-radius: 5px;
      background: #f0f0f0;
      font-size: 10px;
      color: #555;
    }

    .result-actions {
      display: flex;
      gap: 6px;
      margin-top: 9px;
      flex-wrap: wrap;
    }

    .mini-button {
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: white;
      font-size: 10px;
      color: #444;
      text-decoration: none;
    }

    .empty {
      padding: 30px 20px;
      text-align: center;
      color: #888;
      font-size: 13px;
      line-height: 1.8;
    }

    /* 오른쪽 지도 */
    .map-area {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 지도 상단 안내 */
    .map-toolbar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
    }

    .map-toolbar > * {
      pointer-events: auto;
    }

    .map-badge {
      padding: 10px 13px;
      border-radius: 9px;
      background: white;
      box-shadow: 0 2px 10px #00000018;
      font-size: 12px;
    }

    .toolbar-buttons {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .toolbar-button {
      padding: 10px 12px;
      border: 0;
      border-radius: 9px;
      background: white;
      box-shadow: 0 2px 10px #00000018;
      font-size: 12px;
      font-weight: bold;
    }

    .toolbar-button:hover {
      background: #f0edff;
    }

    /* 공연장 상세 정보 팝업 */
    .detail-window {
      width: 250px;
      padding: 13px;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #242424;
    }

    .detail-title {
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: bold;
    }

    .detail-text {
      margin-bottom: 7px;
      font-size: 12px;
      line-height: 1.6;
      color: #666;
      overflow-wrap: anywhere;
    }

    .detail-link {
      display: inline-block;
      margin: 3px 4px 0 0;
      padding: 7px 9px;
      border-radius: 6px;
      background: #7861df;
      color: white;
      text-decoration: none;
      font-size: 11px;
    }

    .detail-link.secondary {
      background: #eeeeF5;
      color: #393444;
    }

    /* 로드뷰 팝업 */
    .roadview-panel {
      position: absolute;
      right: 15px;
      bottom: 15px;
      z-index: 5;
      display: none;
      width: min(460px, calc(100% - 30px));
      height: 330px;
      overflow: hidden;
      border-radius: 12px;
      background: white;
      box-shadow: 0 4px 24px #00000030;
    }

    .roadview-panel.open {
      display: block;
    }

    .roadview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 43px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: bold;
    }

    #closeRoadview {
      padding: 5px 9px;
      border: 0;
      border-radius: 6px;
      background: #eee;
    }

    #roadview {
      width: 100%;
      height: calc(100% - 43px);
      background: #eee;
    }

    /* 화면이 좁을 때 레이아웃 조절 */
    @media (max-width: 700px) {
      .sidebar {
        width: 45%;
        min-width: 190px;
      }

      .header {
        padding: 17px 13px;
      }

      .header h1 {
        font-size: 20px;
      }

      .tabs {
        gap: 4px;
        padding: 10px 7px;
      }

      .tab {
        font-size: 11px;
      }

      .category-visual {
        margin: 3px 7px 10px;
        padding: 8px;
        gap: 7px;
      }

      .category-art {
        width: 42px;
        height: 48px;
        font-size: 25px;
      }

      .category-description {
        font-size: 10px;
      }

      .category-description strong {
        font-size: 12px;
      }

      .search-form {
        padding: 0 7px 10px;
      }

      .map-badge {
        display: none;
      }

      .toolbar-button {
        padding: 8px;
        font-size: 10px;
      }

      .roadview-panel {
        height: 260px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- 왼쪽 공연장 검색 영역 -->
    <aside class="sidebar">

      <header class="header">
        <div class="eyebrow">STAGE FINDER</div>
        <h1>공연장 지도</h1>
        <p>내 주변 공연장을 찾고 위치와 길찾기를 확인하세요.</p>
      </header>

      <!-- 공연장 유형 선택 -->
      <div class="tabs">
        <button class="tab active" data-type="small">
          <span class="tab-icon">🎭</span>
          소극장
          <span class="tab-size">400석 미만</span>
        </button>

        <button class="tab" data-type="medium">
          <span class="tab-icon">🎟️</span>
          중극장
          <span class="tab-size">400~999석</span>
        </button>

        <button class="tab" data-type="large">
          <span class="tab-icon">🏛️</span>
          대극장
          <span class="tab-size">1000석 이상</span>
        </button>
      </div>

      <!-- 유형별 시각 자료와 설명 -->
      <div class="category-visual">
        <div id="categoryArt" class="category-art small">🎭</div>
        <div class="category-description">
          <strong id="categoryTitle">소극장</strong>
          <span id="categoryDescription">
            관객과 무대의 거리가 가까운 공연 공간
          </span>
        </div>
      </div>

      <!-- 직접 검색할 수 있는 검색창 -->
      <form class="search-form" id="searchForm">
        <input
          id="searchInput"
          type="text"
          placeholder="공연장 이름 또는 지역"
          autocomplete="off"
        >
        <button id="searchButton" type="submit">검색</button>
      </form>

      <!-- 위치 및 검색 상태 -->
      <div class="status" id="statusMessage" role="status" aria-live="polite">
        카카오 지도를 불러오는 중입니다.
      </div>

      <!-- 검색 결과 -->
      <div class="results" id="resultList">
        <div class="empty">지도를 준비하고 있습니다.</div>
      </div>

    </aside>

    <!-- 오른쪽 지도 영역 -->
    <main class="map-area">
      <div id="map"></div>

      <div class="map-toolbar">
        <div class="map-badge" id="mapStatus">
          📍 현재 위치 확인 중
        </div>

        <div class="toolbar-buttons">
          <button class="toolbar-button" id="myLocationButton">
            📍 내 위치
          </button>
          <button class="toolbar-button" id="roadviewButton">
            🛣️ 로드뷰
          </button>
        </div>
      </div>

      <!-- 로드뷰 표시 영역 -->
      <section class="roadview-panel" id="roadviewPanel">
        <div class="roadview-header">
          <span id="roadviewTitle">공연장 주변 로드뷰</span>
          <button id="closeRoadview">닫기 ✕</button>
        </div>
        <div id="roadview"></div>
      </section>
    </main>

  </div>

  <script>
    // 카카오 지도와 장소 검색에 사용할 변수
    let map = null;
    let placesService = null;
    let infoWindow = null;
    let roadview = null;
    let roadviewClient = null;
    let currentPosition = null;
    let currentLocationMarker = null;
    let selectedPlace = null;
    let activeType = "small";
    let isMapReady = false;
    let searchVersion = 0;

    // 현재 탭에 표시할 공연장 목록
    let currentPlaces = [];

    // 공연장 마커 목록
    let placeMarkers = [];

    // HTML 요소 가져오기
    const statusMessage = document.getElementById("statusMessage");
    const mapStatus = document.getElementById("mapStatus");
    const resultList = document.getElementById("resultList");
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const categoryArt = document.getElementById("categoryArt");
    const categoryTitle = document.getElementById("categoryTitle");
    const categoryDescription = document.getElementById("categoryDescription");
    const roadviewPanel = document.getElementById("roadviewPanel");

    // 공연장 유형별 설정
    const categorySettings = {
      small: {
        name: "소극장",
        icon: "🎭",
        className: "small",
        description: "관객과 무대의 거리가 가까운 공연 공간",
        searchTerms: ["소극장", "연극 극장", "공연장"]
      },
      medium: {
        name: "중극장",
        icon: "🎟️",
        className: "medium",
        description: "연극과 뮤지컬 등을 즐기는 중규모 공연 공간",
        searchTerms: ["중극장", "공연장", "뮤지컬 극장"]
      },
      large: {
        name: "대극장",
        icon: "🏛️",
        className: "large",
        description: "대규모 관객을 수용하는 공연 공간",
        searchTerms: ["대극장", "공연장", "콘서트홀"]
      }
    };

    // 상태 메시지 변경
    function updateStatus(message) {
      statusMessage.textContent = message;
    }

    // 지도 초기화
    function initializeMap() {
      const mapContainer = document.getElementById("map");

      // 현재 위치를 확인하기 전 사용할 기본 중심 좌표
      const defaultPosition = new kakao.maps.LatLng(
        37.5665,
        126.9780
      );

      // 지도 생성
      map = new kakao.maps.Map(mapContainer, {
        center: defaultPosition,
        level: 5
      });

      // 지도와 장소 검색 서비스 초기화
      placesService = new kakao.maps.services.Places();
      infoWindow = new kakao.maps.InfoWindow({ zIndex: 10 });

      // 로드뷰 객체 초기화
      roadview = new kakao.maps.Roadview(
        document.getElementById("roadview")
      );
      roadviewClient = new kakao.maps.RoadviewClient();

      // 지도가 실제로 표시된 후 검색 기능 활성화
      kakao.maps.event.addListener(map, "tilesloaded", function() {
        if (!isMapReady) {
          isMapReady = true;
          updateStatus("지도가 준비되었습니다. 주변 공연장을 검색합니다.");
          searchVenues(activeType);
        }
      });

      // 지도가 준비된 후 현재 위치 요청
      requestCurrentLocation();
    }

    // 브라우저에서 현재 위치 권한 요청
    function requestCurrentLocation() {
      if (!navigator.geolocation) {
        updateStatus(
          "위치 정보를 지원하지 않는 브라우저입니다. 서울 시청 기준으로 검색합니다."
        );
        mapStatus.textContent = "📍 기본 위치: 서울 시청";
        return;
      }

      updateStatus("현재 위치 권한을 확인하고 있습니다.");

      navigator.geolocation.getCurrentPosition(
        function(position) {
          // 위도와 경도를 지도 좌표로 변환
          currentPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          // 지도 중심을 현재 위치로 이동
          if (map) {
            map.setCenter(currentPosition);
          }

          // 현재 위치 마커 표시
          if (currentLocationMarker) {
            currentLocationMarker.setMap(null);
          }

          currentLocationMarker = new kakao.maps.Marker({
            map: map,
            position: currentPosition,
            title: "내 현재 위치"
          });

          // 현재 위치 마커 클릭 시 안내 표시
          kakao.maps.event.addListener(
            currentLocationMarker,
            "click",
            function() {
              infoWindow.setContent(
                '<div style="padding:10px;font-size:12px;">📍 내 현재 위치</div>'
              );
              infoWindow.open(map, currentLocationMarker);
            }
          );

          mapStatus.textContent = "📍 현재 위치 확인 완료";
          updateStatus("현재 위치를 확인했습니다. 주변 공연장을 검색합니다.");

          // 위치가 확인되면 현재 탭의 검색 결과 갱신
          if (isMapReady) {
            searchVenues(activeType);
          }
        },

        function(error) {
          // 위치 확인 실패 시 기본 중심 좌표를 유지
          let message = "현재 위치를 확인할 수 없습니다.";

          if (error.code === error.PERMISSION_DENIED) {
            message = "위치 권한이 거부되었습니다.";
          } else if (error.code === error.TIMEOUT) {
            message = "위치 확인 시간이 초과되었습니다.";
          }

          mapStatus.textContent = "📍 기본 위치: 서울 시청";
          updateStatus(
            message + " 서울 시청 기준으로 공연장을 검색합니다."
          );

          if (isMapReady) {
            searchVenues(activeType);
          }
        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    // 현재 검색 마커를 모두 제거
    function clearPlaceMarkers() {
      placeMarkers.forEach(function(marker) {
        marker.setMap(null);
      });

      placeMarkers = [];

      if (infoWindow) {
        infoWindow.close();
      }
    }

    // 이전 결과 목록을 지우고 안내 문구 표시
    function clearResults(message) {
      resultList.innerHTML = "";

      const emptyMessage = document.createElement("div");
      emptyMessage.className = "empty";
      emptyMessage.textContent = message;

      resultList.appendChild(emptyMessage);
    }

    // 공연장 유형에 맞는 마커 모양 생성
    function createMarkerImage(type) {
      const settings = categorySettings[type];

      // 유형마다 다른 색상과 아이콘을 사용
      const colors = {
        small: "#7856d8",
        medium: "#238bc4",
        large: "#e4773d"
      };

      const color = colors[type];
      const icon = settings.icon;

      const svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="46" height="54" viewBox="0 0 46 54">' +
          '<path d="M23 52 C19 43 4 29 4 19 A19 19 0 1 1 42 19 C42 29 27 43 23 52Z" fill="' + color + '" stroke="white" stroke-width="2"/>' +
          '<circle cx="23" cy="19" r="14" fill="white"/>' +
          '<text x="23" y="25" font-size="17" text-anchor="middle">' + icon + '</text>' +
        '</svg>';

      const imageUrl =
        "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg);

      return new kakao.maps.MarkerImage(
        imageUrl,
        new kakao.maps.Size(46, 54),
        {
          offset: new kakao.maps.Point(23, 52)
        }
      );
    }

    // 현재 위치에서 특정 공연장까지 가는 길찾기 주소 생성
    function createDirectionsUrl(place, mode) {
      const destinationName = encodeURIComponent(place.place_name);
      const destinationLat = Number(place.y);
      const destinationLng = Number(place.x);

      // 출발 위치를 알 수 없으면 목적지 길찾기 화면만 열기
      if (!currentPosition) {
        return "https://map.kakao.com/link/search/" + destinationName;
      }

      const startName = encodeURIComponent("내 현재 위치");
      const startLat = currentPosition.getLat();
      const startLng = currentPosition.getLng();

      // 카카오맵에서 이동 수단별 길찾기 화면 열기
      return (
        "https://map.kakao.com/link/by/" + mode + "/" +
        startName + "," + startLat + "," + startLng + "/" +
        destinationName + "," + destinationLat + "," + destinationLng
      );
    }

    // 공연장 상세 팝업에 표시할 정보 생성
    function createDetailContent(place, type) {
      const settings = categorySettings[type];
      const address =
        place.road_address_name || place.address_name || "주소 정보 없음";

      const directionsUrl = createDirectionsUrl(place, "traffic");

      const walkingUrl = createDirectionsUrl(place, "walk");

      const roadviewUrl =
        "https://map.kakao.com/link/roadview/" +
        Number(place.y) + "," + Number(place.x);

      const placeUrl = place.place_url || (
        "https://map.kakao.com/link/search/" +
        encodeURIComponent(place.place_name)
      );

      // 팝업에 표시할 HTML 구성
      return (
        '<div class="detail-window">' +
          '<div class="detail-title">' +
            settings.icon + " " + escapeHTML(place.place_name) +
          '</div>' +
          '<div class="detail-text">' +
            escapeHTML(settings.name) + ' 검색 결과<br>' +
            escapeHTML(address) +
          '</div>' +
          '<div class="detail-text">' +
            '좌석 규모: 실제 객석 수 미확인' +
          '</div>' +
          '<div class="detail-text">' +
            '전화번호: ' +
            escapeHTML(place.phone || "등록된 전화번호 없음") +
          '</div>' +
          '<a class="detail-link" href="' + directionsUrl + '" target="_blank" rel="noopener noreferrer">대중교통 길찾기</a>' +
          '<a class="detail-link secondary" href="' + walkingUrl + '" target="_blank" rel="noopener noreferrer">도보 길찾기</a>' +
          '<a class="detail-link secondary" href="' + roadviewUrl + '" target="_blank" rel="noopener noreferrer">로드뷰 새 창</a>' +
          '<a class="detail-link secondary" href="' + placeUrl + '" target="_blank" rel="noopener noreferrer">장소 상세</a>' +
        '</div>'
      );
    }

    // HTML 문자열의 특수문자 처리
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, function(character) {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };

        return entities[character];
      });
    }

    // 공연장 하나의 지도 마커 생성
    function addPlaceMarker(place, type) {
      const position = new kakao.maps.LatLng(
        Number(place.y),
        Number(place.x)
      );

      const marker = new kakao.maps.Marker({
        map: map,
        position: position,
        image: createMarkerImage(type),
        title: place.place_name
      });

      // 마커를 클릭하면 장소 상세 정보 표시
      kakao.maps.event.addListener(marker, "click", function() {
        selectedPlace = place;

        infoWindow.setContent(createDetailContent(place, type));
        infoWindow.open(map, marker);

        highlightResult(place.id);
      });

      placeMarkers.push(marker);

      return marker;
    }

    // 선택한 공연장에 해당하는 결과 항목 강조
    function highlightResult(placeId) {
      document.querySelectorAll(".result-item").forEach(function(item) {
        item.classList.toggle(
          "selected",
          item.dataset.placeId === String(placeId)
        );
      });
    }

    // 공연장 검색 결과 목록 표시
    function displayResults(places, type) {
      resultList.innerHTML = "";

      if (places.length === 0) {
        clearResults(
          "검색 결과가 없습니다.\n다른 지역이나 검색어를 입력해 보세요."
        );
        return;
      }

      const count = document.createElement("div");
      count.className = "result-count";
      count.textContent = "검색 결과 " + places.length + "곳";

      resultList.appendChild(count);

      places.forEach(function(place) {
        const settings = categorySettings[type];

        const item = document.createElement("div");
        item.className = "result-item";
        item.dataset.placeId = String(place.id);

        const markerIcon = document.createElement("div");
        markerIcon.className = "result-marker " + settings.className;
        markerIcon.textContent = settings.icon;

        const info = document.createElement("div");
        info.className = "result-info";

        const name = document.createElement("div");
        name.className = "result-name";
        name.textContent = place.place_name;

        const address = document.createElement("div");
        address.className = "result-address";
        address.textContent =
          place.road_address_name ||
          place.address_name ||
          "주소 정보 없음";

        const capacity = document.createElement("span");
        capacity.className = "result-capacity";
        capacity.textContent = "객석 수 미확인";

        const actions = document.createElement("div");
        actions.className = "result-actions";

        const directionsLink = document.createElement("a");
        directionsLink.className = "mini-button";
        directionsLink.textContent = "길찾기";
        directionsLink.href = createDirectionsUrl(place, "traffic");
        directionsLink.target = "_blank";
        directionsLink.rel = "noopener noreferrer";

        // 링크 클릭이 결과 항목 클릭으로 이어지지 않도록 처리
        directionsLink.addEventListener("click", function(event) {
          event.stopPropagation();
        });

        const roadviewLink = document.createElement("button");
        roadviewLink.className = "mini-button";
        roadviewLink.textContent = "로드뷰";

        roadviewLink.addEventListener("click", function(event) {
          event.stopPropagation();
          openRoadview(place);
        });

        actions.appendChild(directionsLink);
        actions.appendChild(roadviewLink);

        info.appendChild(name);
        info.appendChild(address);
        info.appendChild(capacity);
        info.appendChild(actions);

        item.appendChild(markerIcon);
        item.appendChild(info);

        // 목록 항목을 누르면 지도 중심 이동 및 상세 팝업 표시
        item.addEventListener("click", function() {
          moveToPlace(place, type);
        });

        resultList.appendChild(item);
      });
    }

    // 선택한 공연장으로 이동하고 상세 팝업 표시
    function moveToPlace(place, type) {
      selectedPlace = place;

      const position = new kakao.maps.LatLng(
        Number(place.y),
        Number(place.x)
      );

      map.setCenter(position);
      map.setLevel(3);

      const marker = placeMarkers.find(function(item) {
        const markerPosition = item.getPosition();

        return (
          Math.abs(markerPosition.getLat() - Number(place.y)) < 0.000001 &&
          Math.abs(markerPosition.getLng() - Number(place.x)) < 0.000001
        );
      });

      if (marker) {
        infoWindow.setContent(createDetailContent(place, type));
        infoWindow.open(map, marker);
      }

      highlightResult(place.id);
    }

    // 키워드 검색 결과를 모으고 중복 장소 제거
    function searchVenues(type, customKeyword) {
      if (!isMapReady || !placesService) {
        updateStatus("지도가 준비될 때까지 기다려 주세요.");
        return;
      }

      const settings = categorySettings[type];
      const version = ++searchVersion;

      activeType = type;
      selectedPlace = null;

      clearPlaceMarkers();
      clearResults("공연장을 검색하고 있습니다.");

      searchButton.disabled = true;

      const keywords = customKeyword
        ? [customKeyword.trim()]
        : settings.searchTerms;

      updateStatus(settings.name + " 검색 중입니다.");

      // 현재 위치가 있으면 그 주변부터 검색
      const searchOptions = {
        sort: kakao.maps.services.SortBy.DISTANCE,
        size: 15
      };

      if (currentPosition) {
        searchOptions.location = currentPosition;
        searchOptions.radius = 10000;
      }

      let completedSearches = 0;
      let allPlaces = [];

      // 여러 검색어의 결과를 합쳐 공연장 목록 구성
      keywords.forEach(function(keyword) {
        placesService.keywordSearch(
          keyword,
          function(data, status) {
            // 이전 탭에서 시작한 검색 결과는 무시
            if (version !== searchVersion) {
              return;
            }

            if (status === kakao.maps.services.Status.OK) {
              allPlaces = allPlaces.concat(data);
            }

            completedSearches++;

            if (completedSearches === keywords.length) {
              finishSearch(allPlaces, type, version);
            }
          },
          searchOptions
        );
      });
    }

    // 검색 결과를 정리하고 화면과 지도에 반영
    function finishSearch(places, type, version) {
      if (version !== searchVersion) {
        return;
      }

      searchButton.disabled = false;

      // 장소 ID를 기준으로 중복 결과 제거
      const uniquePlaces = [];
      const seenIds = new Set();

      places.forEach(function(place) {
        if (!seenIds.has(place.id)) {
          seenIds.add(place.id);
          uniquePlaces.push(place);
        }
      });

      // 현재 위치가 있을 때 가까운 순서로 정렬
      if (currentPosition) {
        uniquePlaces.sort(function(a, b) {
          const distanceA = getDistance(
            currentPosition.getLat(),
            currentPosition.getLng(),
            Number(a.y),
            Number(a.x)
          );

          const distanceB = getDistance(
            currentPosition.getLat(),
            currentPosition.getLng(),
            Number(b.y),
            Number(b.x)
          );

          return distanceA - distanceB;
        });
      }

      currentPlaces = uniquePlaces;

      displayResults(uniquePlaces, type);

      // 결과가 없어도 기존 마커가 남지 않도록 먼저 초기화
      clearPlaceMarkers();

      if (uniquePlaces.length > 0) {
        const bounds = new kakao.maps.LatLngBounds();

        uniquePlaces.forEach(function(place) {
          addPlaceMarker(place, type);

          bounds.extend(
            new kakao.maps.LatLng(
              Number(place.y),
              Number(place.x)
            )
          );
        });

        // 검색 결과가 보이도록 지도 범위 조절
        map.setBounds(bounds);
        updateStatus(
          categorySettings[type].name +
          " 검색 완료: " + uniquePlaces.length + "곳"
        );
      } else {
        updateStatus(
          "검색 결과가 없습니다. 다른 검색어를 입력해 보세요."
        );
      }
    }

    // 두 좌표 사이의 직선거리를 계산
    function getDistance(lat1, lng1, lat2, lng2) {
      const toRadians = function(degrees) {
        return degrees * Math.PI / 180;
      };

      const earthRadius = 6371;
      const deltaLat = toRadians(lat2 - lat1);
      const deltaLng = toRadians(lng2 - lng1);

      const value =
        Math.sin(deltaLat / 2) * Math.sin(deltaLat / 2) +
        Math.cos(toRadians(lat1)) *
        Math.cos(toRadians(lat2)) *
        Math.sin(deltaLng / 2) *
        Math.sin(deltaLng / 2);

      return earthRadius * 2 * Math.atan2(
        Math.sqrt(value),
        Math.sqrt(1 - value)
      );
    }

    // 선택된 공연장 위치의 로드뷰 표시
    function openRoadview(place) {
      if (!roadviewClient || !roadview) {
        updateStatus("로드뷰를 초기화하지 못했습니다.");
        return;
      }

      const position = new kakao.maps.LatLng(
        Number(place.y),
        Number(place.x)
      );

      document.getElementById("roadviewTitle").textContent =
        place.place_name + " 주변 로드뷰";

      roadviewPanel.classList.add("open");

      // 공연장 좌표에서 가까운 로드뷰 파노라마 검색
      roadviewClient.getNearestPanoId(
        position,
        100,
        function(panoId) {
          if (panoId) {
            roadview.setPanoId(panoId, position);
          } else {
            updateStatus(
              "이 공연장 주변에는 이용 가능한 로드뷰가 없습니다."
            );
          }
        }
      );
    }

    // 현재 선택된 공연장의 로드뷰 열기
    function openSelectedRoadview() {
      if (!selectedPlace) {
        updateStatus(
          "먼저 왼쪽 목록이나 지도에서 공연장을 선택해 주세요."
        );
        return;
      }

      openRoadview(selectedPlace);
    }

    // 탭 버튼 클릭 처리
    document.querySelectorAll(".tab").forEach(function(tab) {
      tab.addEventListener("click", function() {
        const type = tab.dataset.type;

        // 선택된 탭 디자인 변경
        document.querySelectorAll(".tab").forEach(function(item) {
          item.classList.toggle("active", item === tab);
        });

        // 유형별 이미지와 설명 변경
        const settings = categorySettings[type];

        categoryArt.className = "category-art " + settings.className;
        categoryArt.textContent = settings.icon;
        categoryTitle.textContent = settings.name;
        categoryDescription.textContent = settings.description;

        // 이전 결과를 제거하고 새 유형 검색
        searchVenues(type);
      });
    });

    // 검색창에서 직접 입력한 키워드 검색
    document.getElementById("searchForm").addEventListener(
      "submit",
      function(event) {
        event.preventDefault();

        const keyword = searchInput.value.trim();

        if (!keyword) {
          updateStatus("검색어를 입력해 주세요.");
          return;
        }

        searchVenues(activeType, keyword);
      }
    );

    // 현재 위치 버튼 클릭 처리
    document.getElementById("myLocationButton").addEventListener(
      "click",
      function() {
        if (currentPosition) {
          map.setCenter(currentPosition);
          map.setLevel(5);
        } else {
          requestCurrentLocation();
        }
      }
    );

    // 로드뷰 버튼 클릭 처리
    document.getElementById("roadviewButton").addEventListener(
      "click",
      openSelectedRoadview
    );

    // 로드뷰 닫기
    document.getElementById("closeRoadview").addEventListener(
      "click",
      function() {
        roadviewPanel.classList.remove("open");
      }
    );

    // SDK 전체가 준비된 뒤에 지도 초기화
    if (window.kakao && kakao.maps) {
      kakao.maps.load(function() {
        initializeMap();
      });
    } else {
      updateStatus(
        "카카오 지도 SDK 로딩에 실패했습니다. API 키와 도메인 설정을 확인하세요."
      );
      mapStatus.textContent = "지도 로딩 실패";
    }
  </script>
</body>
