
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대한민국 공연장 지도</title>

  <!-- 카카오 지도 SDK: 본인의 JavaScript 키로 교체하세요. -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=11a56469b67306e63016649e688605c8&libraries=services&autoload=false"></script>

  <!-- 엑셀 파일을 읽기 위한 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
    }

    .container {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* 왼쪽 검색 패널 */
    .sidebar {
      width: 370px;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
      background: white;
      z-index: 2;
    }

    .header {
      padding: 20px;
      border-bottom: 1px solid #eee;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }

    .description {
      font-size: 12px;
      color: #777;
      line-height: 1.7;
    }

    /* 엑셀 파일 업로드 */
    .upload-area {
      margin-top: 14px;
      padding: 12px;
      border: 1px dashed #bbb;
      border-radius: 10px;
      background: #fafafa;
    }

    .upload-area label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #excelFile {
      width: 100%;
      font-size: 11px;
    }

    /* 공연장 규모 탭 */
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 15px;
    }

    .tab {
      padding: 10px 3px;
      border: 1px solid #ddd;
      border-radius: 9px;
      background: white;
      cursor: pointer;
      font-weight: bold;
    }

    .tab small {
      display: block;
      margin-top: 4px;
      font-size: 10px;
      font-weight: normal;
    }

    .tab.active[data-type="small"] {
      color: white;
      background: #2878d0;
    }

    .tab.active[data-type="medium"] {
      color: white;
      background: #139b78;
    }

    .tab.active[data-type="large"] {
      color: white;
      background: #e16b32;
    }

    .tool-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .tool-buttons button {
      flex: 1;
      padding: 9px 5px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: 11px;
    }

    #status {
      padding: 12px 16px;
      background: #fafafa;
      border-bottom: 1px solid #eee;
      font-size: 12px;
      line-height: 1.6;
      color: #555;
    }

    /* 검색 결과 목록 */
    #resultList {
      flex: 1;
      overflow-y: auto;
    }

    .result-item {
      padding: 13px 15px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .result-item:hover {
      background: #f7f9fc;
    }

    .result-top {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .category-image {
      width: 45px;
      height: 45px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-size: 23px;
    }

    .small-bg { background: #e5f0ff; }
    .medium-bg { background: #e1f6ee; }
    .large-bg { background: #ffede2; }

    .result-name {
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: bold;
    }

    .result-meta,
    .result-address {
      font-size: 11px;
      color: #777;
      line-height: 1.6;
    }

    .result-address {
      margin-top: 8px;
    }

    .result-actions {
      display: flex;
      gap: 6px;
      margin-top: 9px;
    }

    .result-actions button {
      padding: 6px 9px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 11px;
    }

    .empty {
      padding: 25px 18px;
      color: #777;
      font-size: 12px;
      line-height: 1.8;
    }

    /* 오른쪽 지도 */
    .map-area {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .map-controls {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .map-controls button {
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: white;
      box-shadow: 0 2px 8px #0002;
      cursor: pointer;
      font-size: 12px;
    }

    /* 로드뷰 영역 */
    #roadview {
      display: none;
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: min(430px, 70%);
      height: 270px;
      z-index: 4;
      border: 2px solid white;
      border-radius: 10px;
      box-shadow: 0 2px 12px #0003;
      background: #eee;
    }

    .legend {
      position: absolute;
      bottom: 15px;
      left: 15px;
      z-index: 2;
      padding: 10px 13px;
      border-radius: 9px;
      background: white;
      box-shadow: 0 2px 8px #0002;
      font-size: 11px;
      line-height: 1.8;
    }

    .popup {
      min-width: 210px;
      max-width: 270px;
      padding: 12px;
      font-family: Arial, "Malgun Gothic", sans-serif;
    }

    .popup strong {
      font-size: 14px;
    }

    .popup p {
      margin: 7px 0;
      font-size: 12px;
      line-height: 1.7;
      color: #555;
      white-space: normal;
    }

    .popup a {
      display: inline-block;
      margin: 4px 8px 0 0;
      color: #1769aa;
      font-size: 12px;
      text-decoration: none;
    }

    @media (max-width: 650px) {
      .sidebar {
        width: 48%;
        min-width: 175px;
      }

      .header {
        padding: 12px 9px;
      }

      h1 {
        font-size: 16px;
      }

      .description {
        font-size: 10px;
      }

      .tab {
        font-size: 11px;
      }

      .tab small {
        font-size: 9px;
      }

      .category-image {
        width: 34px;
        height: 34px;
        font-size: 18px;
      }

      .result-item {
        padding: 10px 8px;
      }

      .result-name {
        font-size: 12px;
      }

      .legend {
        left: 5px;
        bottom: 5px;
        font-size: 9px;
      }

      #roadview {
        width: 90%;
        height: 210px;
      }
    }
  </style>
</head>

<body>
<div class="container">

  <!-- 왼쪽: 엑셀 업로드, 규모 선택, 공연장 목록 -->
  <aside class="sidebar">
    <header class="header">
      <h1>🎭 대한민국 공연장 지도</h1>

      <div class="description">
        객석 규모에 따라 공연장을 검색합니다.<br>
        소극장: 400석 미만<br>
        중극장: 400석 이상 1,000석 미만<br>
        대극장: 1,000석 이상
      </div>

      <div class="upload-area">
        <label for="excelFile">📁 공연장 엑셀 파일 불러오기</label>
        <input type="file" id="excelFile" accept=".xls,.xlsx">
      </div>

      <div class="tabs">
        <button class="tab active" data-type="small">
          소극장
          <small>400석 미만</small>
        </button>

        <button class="tab" data-type="medium">
          중극장
          <small>400~999석</small>
        </button>

        <button class="tab" data-type="large">
          대극장
          <small>1,000석 이상</small>
        </button>
      </div>

      <div class="tool-buttons">
        <button id="locateButton">📍 내 위치</button>
        <button id="roadviewButton">🛣️ 로드뷰</button>
      </div>
    </header>

    <div id="status" role="status" aria-live="polite">
      지도를 불러오는 중입니다.
    </div>

    <div id="resultList">
      <div class="empty">
        엑셀 파일을 선택한 다음 공연장 규모를 눌러 주세요.
      </div>
    </div>
  </aside>

  <!-- 오른쪽: 카카오 지도와 로드뷰 -->
  <main class="map-area">
    <div id="map"></div>
    <div id="roadview"></div>

    <div class="map-controls">
      <button id="roadmapButton">일반 지도</button>
      <button id="skyviewButton">스카이뷰</button>
      <button id="closeRoadviewButton">로드뷰 닫기</button>
    </div>

    <div class="legend">
      🔵 소극장　🟢 중극장　🟠 대극장<br>
      마커를 누르면 공연장 상세 정보가 표시됩니다.
    </div>
  </main>
</div>

<script>
  // 공연장 규모별 설정
  const categoryConfig = {
    small: {
      label: "소극장",
      color: "#2878d0",
      markerText: "S",
      emoji: "🎟️",
      imageClass: "small-bg"
    },
    medium: {
      label: "중극장",
      color: "#139b78",
      markerText: "M",
      emoji: "🎭",
      imageClass: "medium-bg"
    },
    large: {
      label: "대극장",
      color: "#e16b32",
      markerText: "L",
      emoji: "🏛️",
      imageClass: "large-bg"
    }
  };

  // 지도 및 검색 상태를 저장하는 변수
  let map = null;
  let geocoder = null;
  let infoWindow = null;
  let roadview = null;
  let roadviewClient = null;

  let currentPosition = null;
  let currentMarker = null;
  let theaterData = [];
  let theaterMarkers = [];
  let currentResults = [];
  let activeType = "small";
  let searchToken = 0;
  let isRoadviewVisible = false;

  // HTML 요소
  const statusElement = document.getElementById("status");
  const resultList = document.getElementById("resultList");
  const excelFile = document.getElementById("excelFile");

  // 상태 메시지 표시
  function setStatus(message) {
    statusElement.textContent = message;
  }

  // HTML에 표시할 문자열의 특수문자 처리
  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[character]);
  }

  // 객석 수에 따라 공연장 규모를 분류
  function getCategory(seats) {
    if (seats < 400) return "small";
    if (seats < 1000) return "medium";
    return "large";
  }

  // 목록이 비었을 때 안내 문구 표시
  function showEmpty(message) {
    resultList.innerHTML = "";

    const element = document.createElement("div");
    element.className = "empty";
    element.textContent = message;

    resultList.appendChild(element);
  }

  // 엑셀 파일을 읽고 공연장 데이터로 변환
  excelFile.addEventListener("change", function(event) {
    const file = event.target.files[0];

    if (!file) return;

    if (typeof XLSX === "undefined") {
      setStatus("엑셀 라이브러리를 불러오지 못했습니다.");
      return;
    }

    const reader = new FileReader();

    reader.onload = function(loadEvent) {
      try {
        const workbook = XLSX.read(loadEvent.target.result, {
          type: "array"
        });

        const sheet = workbook.Sheets[workbook.SheetNames[0]];

        // 첫 번째 행의 안내 문구가 있을 수 있어 원본 행을 확인
        const rows = XLSX.utils.sheet_to_json(sheet, {
          header: 1,
          defval: ""
        });

        const headerIndex = rows.findIndex(row =>
          row.includes("공연장명") &&
          row.includes("주소") &&
          row.includes("객석수")
        );

        if (headerIndex === -1) {
          setStatus("엑셀에서 공연장명, 주소, 객석수 열을 찾지 못했습니다.");
          return;
        }

        const headers = rows[headerIndex].map(value =>
          String(value).trim()
        );

        const nameIndex = headers.indexOf("공연장명");
        const addressIndex = headers.indexOf("주소");
        const seatsIndex = headers.indexOf("객석수");
        const provinceIndex = headers.indexOf("시/군 구분");
        const districtIndex = headers.indexOf("시/군/구 구분");

        theaterData = rows.slice(headerIndex + 1)
          .map(row => {
            const name = String(row[nameIndex] ?? "").trim();
            const address = String(row[addressIndex] ?? "").trim();
            const seats = Number(
              String(row[seatsIndex] ?? "").replace(/,/g, "")
            );

            return {
              name,
              address,
              seats,
              province: provinceIndex >= 0
                ? String(row[provinceIndex] ?? "").trim()
                : "",
              district: districtIndex >= 0
                ? String(row[districtIndex] ?? "").trim()
                : ""
            };
          })
          .filter(theater =>
            theater.name &&
            theater.address &&
            Number.isFinite(theater.seats) &&
            theater.seats >= 0
          );

        setStatus(
          "엑셀에서 공연장 " +
          theaterData.length.toLocaleString() +
          "개를 불러왔습니다. 규모를 선택해 주세요."
        );

        searchNearbyTheaters(activeType);
      } catch (error) {
        console.error(error);
        setStatus("엑셀 파일을 읽지 못했습니다. 파일 형식을 확인해 주세요.");
      }
    };

    reader.readAsArrayBuffer(file);
  });

  // 규모별 탭 선택
  document.querySelectorAll(".tab").forEach(button => {
    button.addEventListener("click", function() {
      activeType = button.dataset.type;

      document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.toggle("active", tab === button);
      });

      searchNearbyTheaters(activeType);
    });
  });

  // 이전 공연장 마커와 팝업 제거
  function clearTheaterMarkers() {
    theaterMarkers.forEach(marker => marker.setMap(null));
    theaterMarkers = [];

    if (infoWindow) {
      infoWindow.close();
    }
  }

  // 카테고리별 사용자 지정 마커 이미지 생성
  function createMarkerImage(type) {
    const config = categoryConfig[type];

    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg"
           width="42" height="50" viewBox="0 0 42 50">
        <path d="M21 1 C9 1 2 9 2 20 C2 33 21 48 21 48
                 S40 33 40 20 C40 9 33 1 21 1 Z"
              fill="${config.color}" stroke="white" stroke-width="2"/>
        <text x="21" y="26" text-anchor="middle"
              font-size="15" font-weight="bold"
              font-family="Arial" fill="white">
          ${config.markerText}
        </text>
      </svg>`;

    const imageUrl =
      "data:image/svg+xml;charset=utf-8," +
      encodeURIComponent(svg);

    return new kakao.maps.MarkerImage(
      imageUrl,
      new kakao.maps.Size(42, 50),
      { offset: new kakao.maps.Point(21, 48) }
    );
  }

  // 공연장 상세 팝업 내용 생성
  function createPopupHTML(theater) {
    const type = getCategory(theater.seats);
    const config = categoryConfig[type];

    const address = theater.address || "주소 정보 없음";

    const destination =
      encodeURIComponent(theater.name) +
      "," + theater.y +
      "," + theater.x;

    const routeUrl =
      "https://map.kakao.com/link/to/" + destination;

    const roadviewUrl =
      "https://map.kakao.com/link/roadview/" +
      theater.y + "," + theater.x;

    return `
      <div class="popup">
        <strong>${escapeHTML(theater.name)}</strong>
        <p>
          규모: ${config.label}<br>
          객석 수: ${theater.seats.toLocaleString()}석<br>
          주소: ${escapeHTML(address)}
        </p>
        <a href="${routeUrl}" target="_blank" rel="noopener">
          길찾기·교통정보 ↗
        </a>
        <a href="${roadviewUrl}" target="_blank" rel="noopener">
          카카오 로드뷰 ↗
        </a>
      </div>`;
  }

  // 공연장 팝업 열기
  function openTheaterPopup(theater, marker) {
    infoWindow.setContent(createPopupHTML(theater));
    infoWindow.open(map, marker);

    // 선택한 공연장 위치로 로드뷰 이동
    showRoadviewAt(
      new kakao.maps.LatLng(Number(theater.y), Number(theater.x)),
      false
    );
  }

  // 두 지점 사이의 거리를 계산
  function calculateDistance(origin, theater) {
    const lat1 = origin.getLat() * Math.PI / 180;
    const lat2 = Number(theater.y) * Math.PI / 180;

    const dLat = lat2 - lat1;
    const dLng =
      Number(theater.x) * Math.PI / 180 -
      origin.getLng() * Math.PI / 180;

    const a =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(lat1) * Math.cos(lat2) *
      Math.sin(dLng / 2) ** 2;

    return 6371 * 2 *
      Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  // 공연장 목록 표시
  function renderResults(results) {
    resultList.innerHTML = "";

    if (!results.length) {
      showEmpty(
        "주변에서 해당 규모의 공연장을 찾지 못했습니다. " +
        "다른 규모를 선택하거나 지도를 이동해 보세요."
      );
      return;
    }

    results.forEach((theater, index) => {
      const type = getCategory(theater.seats);
      const config = categoryConfig[type];

      const item = document.createElement("article");
      item.className = "result-item";

      const top = document.createElement("div");
      top.className = "result-top";

      const image = document.createElement("div");
      image.className =
        "category-image " + config.imageClass;
      image.textContent = config.emoji;
      image.setAttribute("aria-label", config.label);

      const details = document.createElement("div");

      const name = document.createElement("div");
      name.className = "result-name";
      name.textContent = (index + 1) + ". " + theater.name;

      const meta = document.createElement("div");
      meta.className = "result-meta";
      meta.textContent =
        config.label + " · " +
        theater.seats.toLocaleString() + "석";

      details.append(name, meta);
      top.append(image, details);

      const address = document.createElement("div");
      address.className = "result-address";
      address.textContent = theater.address;

      const actions = document.createElement("div");
      actions.className = "result-actions";

      const routeButton = document.createElement("button");
      routeButton.textContent = "교통·길찾기";

      routeButton.addEventListener("click", event => {
        event.stopPropagation();
        openDirections(theater);
      });

      const roadButton = document.createElement("button");
      roadButton.textContent = "로드뷰";

      roadButton.addEventListener("click", event => {
        event.stopPropagation();

        showRoadviewAt(
          new kakao.maps.LatLng(
            Number(theater.y),
            Number(theater.x)
          ),
          true
        );
      });

      actions.append(routeButton, roadButton);
      item.append(top, address, actions);

      // 목록을 누르면 지도 중심을 공연장으로 이동
      item.addEventListener("click", function() {
        const position = new kakao.maps.LatLng(
          Number(theater.y),
          Number(theater.x)
        );

        map.panTo(position);
        map.setLevel(3);
        openTheaterPopup(theater, theater.marker);
      });

      resultList.appendChild(item);
    });
  }

  // 카카오맵 길찾기 화면 열기
  function openDirections(theater) {
    const destination =
      encodeURIComponent(theater.name) +
      "," + theater.y +
      "," + theater.x;

    let url;

    if (currentPosition) {
      const origin =
        encodeURIComponent("내 위치") +
        "," + currentPosition.getLat() +
        "," + currentPosition.getLng();

      url =
        "https://map.kakao.com/link/from/" +
        origin + "/to/" + destination;
    } else {
      url = "https://map.kakao.com/link/to/" + destination;
    }

    window.open(url, "_blank", "noopener");
  }

  // 공연장 마커 생성
  function displayMarkers(results) {
    clearTheaterMarkers();

    results.forEach(theater => {
      const type = getCategory(theater.seats);

      const position = new kakao.maps.LatLng(
        Number(theater.y),
        Number(theater.x)
      );

      const marker = new kakao.maps.Marker({
        map,
        position,
        title: theater.name,
        image: createMarkerImage(type)
      });

      theater.marker = marker;

      kakao.maps.event.addListener(marker, "click", function() {
        openTheaterPopup(theater, marker);
      });

      theaterMarkers.push(marker);
    });
  }

  // 현재 위치 마커 표시
  function updateCurrentMarker() {
    if (currentMarker) {
      currentMarker.setMap(null);
    }

    if (!currentPosition) return;

    currentMarker = new kakao.maps.Marker({
      map,
      position: currentPosition,
      zIndex: 10
    });

    const currentInfo = new kakao.maps.InfoWindow({
      content: '<div style="padding:8px;font-size:12px;">📍 현재 위치</div>'
    });

    kakao.maps.event.addListener(
      currentMarker,
      "click",
      () => currentInfo.open(map, currentMarker)
    );
  }

  // 현재 위치 주변의 공연장 검색
  function searchNearbyTheaters(type) {
    if (!map || !geocoder) return;

    if (!theaterData.length) {
      showEmpty("먼저 위에서 공연장 엑셀 파일을 선택해 주세요.");
      setStatus("엑셀 파일을 기다리고 있습니다.");
      clearTheaterMarkers();
      return;
    }

    if (!currentPosition) {
      showEmpty("현재 위치를 확인하는 중입니다.");
      setStatus("현재 위치 권한을 확인해 주세요.");
      return;
    }

    const token = ++searchToken;

    clearTheaterMarkers();
    currentResults = [];

    const config = categoryConfig[type];

    // 선택한 규모의 공연장만 추출
    const candidates = theaterData.filter(theater =>
      getCategory(theater.seats) === type
    );

    if (!candidates.length) {
      showEmpty("이 규모에 해당하는 공연장이 엑셀에 없습니다.");
      return;
    }

    setStatus(
      config.label + " 주소를 확인하고 있습니다. " +
      "검색 범위는 현재 위치 주변 50km입니다."
    );

    const found = [];
    let index = 0;
    let checked = 0;

    // 주소 검색 요청을 순차적으로 처리
    function processNext() {
      if (token !== searchToken) return;

      if (index >= candidates.length) {
        found.sort((a, b) =>
          calculateDistance(currentPosition, a) -
          calculateDistance(currentPosition, b)
        );

        currentResults = found;

        displayMarkers(found);
        renderResults(found);

        if (found.length) {
          const bounds = new kakao.maps.LatLngBounds();

          bounds.extend(currentPosition);

          found.forEach(theater => {
            bounds.extend(
              new kakao.maps.LatLng(
                Number(theater.y),
                Number(theater.x)
              )
            );
          });

          map.setBounds(bounds);
        }

        setStatus(
          config.label + " " + found.length +
          "곳을 찾았습니다. (주소 확인 " +
          checked + "건)"
        );

        return;
      }

      const theater = candidates[index++];

      geocoder.addressSearch(theater.address, (data, status) => {
        if (token !== searchToken) return;

        checked++;

        if (
          status === kakao.maps.services.Status.OK &&
          data.length
        ) {
          const location = data[0];

          const result = {
            ...theater,
            x: location.x,
            y: location.y
          };

          // 현재 위치에서 50km 이내인 공연장만 결과에 포함
          if (calculateDistance(currentPosition, result) <= 50) {
            found.push(result);
          }
        }

        setStatus(
          config.label + " 주소 확인 중: " +
          checked + "/" + candidates.length
        );

        processNext();
      });
    }

    processNext();
  }

  // 현재 위치 권한 요청
  function requestCurrentLocation() {
    if (!navigator.geolocation) {
      setStatus("이 브라우저는 위치 정보를 지원하지 않습니다.");
      return;
    }

    setStatus("현재 위치를 확인하고 있습니다.");

    navigator.geolocation.getCurrentPosition(
      position => {
        currentPosition = new kakao.maps.LatLng(
          position.coords.latitude,
          position.coords.longitude
        );

        map.setCenter(currentPosition);
        map.setLevel(7);

        updateCurrentMarker();
        searchNearbyTheaters(activeType);
      },
      error => {
        const messages = {
          1: "위치 권한이 거부되었습니다.",
          2: "현재 위치를 확인할 수 없습니다.",
          3: "위치 확인 시간이 초과되었습니다."
        };

        setStatus(
          (messages[error.code] || "위치 확인에 실패했습니다.") +
          " 브라우저의 위치 권한을 확인해 주세요."
        );
      },
      {
        enableHighAccuracy: true,
        timeout: 12000,
        maximumAge: 60000
      }
    );
  }

  // 로드뷰를 특정 위치로 이동
  function showRoadviewAt(position, openPanel) {
    if (!roadview || !roadviewClient) return;

    roadviewClient.getNearestPanoId(position, 50, panoId => {
      if (panoId) {
        roadview.setPanoId(panoId, position);

        if (openPanel) {
          document.getElementById("roadview").style.display = "block";
          roadview.setViewpoint({
            pan: 0,
            tilt: 0,
            zoom: 0
          });

          isRoadviewVisible = true;
          document.getElementById("roadviewButton").textContent =
            "🛣️ 로드뷰 끄기";
        }

        setStatus("로드뷰 위치를 불러왔습니다.");
      } else {
        setStatus("이 위치 주변에는 이용 가능한 로드뷰가 없습니다.");
      }
    });
  }

  // 지도 종류 전환
  function setMapType(type) {
    if (type === "sky") {
      map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);
    } else {
      map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP);
    }
  }

  // 지도와 로드뷰 초기화
  function initializeMap() {
    const defaultPosition = new kakao.maps.LatLng(
      37.5665,
      126.9780
    );

    map = new kakao.maps.Map(
      document.getElementById("map"),
      {
        center: defaultPosition,
        level: 7
      }
    );

    geocoder = new kakao.maps.services.Geocoder();
    infoWindow = new kakao.maps.InfoWindow({ zIndex: 5 });

    roadview = new kakao.maps.Roadview(
      document.getElementById("roadview")
    );

    roadviewClient = new kakao.maps.RoadviewClient();
    roadview.setVisibility(false);

    document.getElementById("locateButton")
      .addEventListener("click", requestCurrentLocation);

    document.getElementById("roadviewButton")
      .addEventListener("click", function() {
        if (isRoadviewVisible) {
          roadview.setVisibility(false);
          document.getElementById("roadview").style.display = "none";
          isRoadviewVisible = false;
          this.textContent = "🛣️ 로드뷰";
        } else {
          if (currentResults.length) {
            const theater = currentResults[0];

            showRoadviewAt(
              new kakao.maps.LatLng(
                Number(theater.y),
                Number(theater.x)
              ),
              true
            );
          } else if (currentPosition) {
            showRoadviewAt(currentPosition, true);
          } else {
            setStatus("먼저 현재 위치를 확인해 주세요.");
          }
        }
      });

    document.getElementById("closeRoadviewButton")
      .addEventListener("click", function() {
        roadview.setVisibility(false);
        document.getElementById("roadview").style.display = "none";
        isRoadviewVisible = false;
        document.getElementById("roadviewButton").textContent = "🛣️ 로드뷰";
      });

    document.getElementById("roadmapButton")
      .addEventListener("click", () => setMapType("road"));

    document.getElementById("skyviewButton")
      .addEventListener("click", () => setMapType("sky"));

    setStatus("지도가 준비되었습니다. 현재 위치를 확인합니다.");
    requestCurrentLocation();
  }

  // 카카오 지도 SDK가 준비되면 지도 생성
  if (window.kakao && kakao.maps) {
    kakao.maps.load(initializeMap);
  } else {
    setStatus(
      "카카오 지도 SDK를 불러오지 못했습니다. " +
      "JavaScript 키와 등록 도메인을 확인해 주세요."
    );
  }
</script>
