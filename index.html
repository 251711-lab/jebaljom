<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 주변 의료시설 찾기</title>

  <!-- 카카오 지도 SDK 불러오기 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=11a56469b67306e63016649e688605c8&libraries=services&autoload=false"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* 왼쪽 의료시설 패널 */
    .sidebar {
      display: flex;
      flex-direction: column;
      width: 390px;
      min-width: 320px;
      height: 100%;
      background: #fff;
      border-right: 1px solid #e5e7eb;
      z-index: 2;
    }

    .header {
      padding: 24px 20px 16px;
      border-bottom: 1px solid #eee;
    }

    .header h1 {
      margin: 0 0 7px;
      font-size: 23px;
    }

    .header p {
      margin: 0;
      color: #777;
      font-size: 13px;
      line-height: 1.6;
    }

    /* 병원 및 약국 탭 */
    .category-tabs {
      display: flex;
      gap: 8px;
      padding: 16px 20px 12px;
    }

    .tab-button {
      flex: 1;
      padding: 13px 8px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #f8fafc;
      color: #555;
      font-weight: bold;
      transition: 0.2s;
    }

    .tab-button.active[data-category="hospital"] {
      color: #1677d2;
      border-color: #1677d2;
      background: #eaf4ff;
    }

    .tab-button.active[data-category="pharmacy"] {
      color: #16845b;
      border-color: #16845b;
      background: #e8f8ef;
    }

    .tab-icon {
      display: block;
      margin-bottom: 5px;
      font-size: 25px;
    }

    /* 검색창 */
    .search-form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 13px;
    }

    #searchInput:focus {
      border-color: #4389e8;
    }

    #searchButton {
      padding: 0 15px;
      border: none;
      border-radius: 8px;
      background: #fee500;
      font-weight: bold;
    }

    /* 위치 및 검색 상태 */
    #statusMessage {
      padding: 12px 20px;
      background: #f8fafc;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
      color: #666;
      font-size: 12px;
      line-height: 1.7;
    }

    .location-button {
      margin: 12px 20px 4px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      color: #333;
      font-size: 13px;
      font-weight: bold;
    }

    .location-button:hover {
      background: #f5f8fc;
    }

    .list-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px 10px;
    }

    .list-heading strong {
      font-size: 14px;
    }

    #resultCount {
      color: #888;
      font-size: 12px;
    }

    /* 검색 결과 목록 */
    #resultList {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    .result-item {
      display: flex;
      gap: 12px;
      padding: 15px 20px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background 0.2s;
    }

    .result-item:hover,
    .result-item.selected {
      background: #f6f9fc;
    }

    .result-image {
      display: flex;
      flex-shrink: 0;
      justify-content: center;
      align-items: center;
      width: 62px;
      height: 62px;
      border-radius: 12px;
      font-size: 30px;
    }

    .result-image.hospital {
      background: #eaf4ff;
    }

    .result-image.pharmacy {
      background: #e8f8ef;
    }

    .result-info {
      flex: 1;
      min-width: 0;
    }

    .result-name {
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .result-category {
      margin-bottom: 5px;
      color: #777;
      font-size: 11px;
    }

    .result-address {
      color: #777;
      font-size: 11px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .result-phone {
      margin-top: 5px;
      color: #555;
      font-size: 11px;
    }

    .empty-message {
      padding: 35px 20px;
      color: #888;
      font-size: 13px;
      line-height: 1.8;
      text-align: center;
    }

    /* 오른쪽 지도 */
    .map-area {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 100%;
      background: #eee;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .map-label {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 1;
      padding: 10px 13px;
      border-radius: 9px;
      background: white;
      box-shadow: 0 2px 8px #00000018;
      font-size: 12px;
      line-height: 1.7;
    }

    .map-legend {
      display: flex;
      gap: 12px;
      margin-top: 5px;
      color: #666;
      font-size: 11px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    /* 지도 위 의료시설 마커 */
    .custom-marker {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 38px;
      height: 38px;
      border: 3px solid white;
      border-radius: 50% 50% 50% 8px;
      box-shadow: 0 2px 7px #00000035;
      transform: rotate(-45deg);
    }

    .custom-marker span {
      font-size: 19px;
      transform: rotate(45deg);
    }

    .custom-marker.hospital {
      background: #2584e8;
    }

    .custom-marker.pharmacy {
      background: #18a66a;
    }

    /* 현재 위치 마커 */
    .current-marker {
      width: 20px;
      height: 20px;
      border: 4px solid white;
      border-radius: 50%;
      background: #3979f6;
      box-shadow: 0 1px 8px #00000055;
    }

    /* 모바일 화면 */
    @media (max-width: 700px) {
      .sidebar {
        width: 45%;
        min-width: 185px;
      }

      .header {
        padding: 17px 12px 12px;
      }

      .header h1 {
        font-size: 18px;
      }

      .header p {
        font-size: 11px;
      }

      .category-tabs {
        padding: 12px 10px 8px;
        gap: 5px;
      }

      .tab-button {
        padding: 10px 4px;
        font-size: 12px;
      }

      .tab-icon {
        font-size: 21px;
      }

      .search-form {
        gap: 5px;
      }

      #searchInput {
        padding: 10px 7px;
        font-size: 11px;
      }

      #searchButton {
        padding: 0 8px;
        font-size: 11px;
      }

      #statusMessage,
      .list-heading {
        padding-left: 10px;
        padding-right: 10px;
      }

      .location-button {
        margin-left: 10px;
        margin-right: 10px;
        font-size: 11px;
      }

      .result-item {
        gap: 8px;
        padding: 12px 9px;
      }

      .result-image {
        width: 38px;
        height: 38px;
        font-size: 21px;
      }

      .result-name {
        font-size: 12px;
      }

      .result-address,
      .result-category,
      .result-phone {
        font-size: 10px;
      }

      .map-label {
        top: 8px;
        right: 8px;
        padding: 8px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- 왼쪽 의료시설 검색 패널 -->
    <aside class="sidebar">

      <header class="header">
        <h1>내 주변 의료시설</h1>
        <p>가까운 병원과 약국을 찾고 위치를 확인하세요.</p>

        <!-- 키워드 검색 -->
        <form class="search-form" id="searchForm">
          <input
            type="text"
            id="searchInput"
            placeholder="병원 이름 또는 약국 이름"
            autocomplete="off"
          >
          <button type="submit" id="searchButton">검색</button>
        </form>
      </header>

      <!-- 의료시설 카테고리 탭 -->
      <div class="category-tabs">
        <button
          type="button"
          class="tab-button active"
          data-category="hospital"
        >
          <span class="tab-icon">🏥</span>
          병원
        </button>

        <button
          type="button"
          class="tab-button"
          data-category="pharmacy"
        >
          <span class="tab-icon">💊</span>
          약국
        </button>
      </div>

      <div id="statusMessage" role="status" aria-live="polite">
        카카오 지도를 불러오는 중입니다.
      </div>

      <button type="button" class="location-button" id="locationButton">
        📍 현재 위치로 이동
      </button>

      <div class="list-heading">
        <strong id="listTitle">주변 병원</strong>
        <span id="resultCount">0곳</span>
      </div>

      <div id="resultList">
        <div class="empty-message">
          지도가 준비되면 주변 의료시설을 검색합니다.
        </div>
      </div>

    </aside>

    <!-- 오른쪽 지도 패널 -->
    <main class="map-area">
      <div id="map"></div>

      <div class="map-label">
        <strong>의료시설 지도</strong>
        <div class="map-legend">
          <span class="legend-item">
            <span class="legend-dot" style="background:#2584e8"></span>
            병원
          </span>
          <span class="legend-item">
            <span class="legend-dot" style="background:#18a66a"></span>
            약국
          </span>
          <span class="legend-item">
            <span class="legend-dot" style="background:#3979f6"></span>
            내 위치
          </span>
        </div>
      </div>
    </main>

  </div>

  <script>
    // 지도와 장소 검색에 사용할 변수
    let map = null;
    let placesService = null;
    let infoWindow = null;

    // 현재 위치와 마커를 관리하는 변수
    let currentPosition = null;
    let currentLocationMarker = null;
    let medicalMarkers = [];
    let currentPlaces = [];

    // 지도 및 검색 상태
    let isMapReady = false;
    let activeCategory = "hospital";
    let searchRequestId = 0;

    // 카테고리별 설정
    const categoryConfig = {
      hospital: {
        code: "HP8",
        name: "병원",
        icon: "🏥",
        markerClass: "hospital",
        color: "#2584e8"
      },
      pharmacy: {
        code: "PM9",
        name: "약국",
        icon: "💊",
        markerClass: "pharmacy",
        color: "#18a66a"
      }
    };

    // HTML 요소 가져오기
    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const statusMessage = document.getElementById("statusMessage");
    const resultList = document.getElementById("resultList");
    const resultCount = document.getElementById("resultCount");
    const listTitle = document.getElementById("listTitle");
    const locationButton = document.getElementById("locationButton");
    const tabButtons = document.querySelectorAll(".tab-button");

    // 상태 메시지 변경
    function updateStatus(message) {
      statusMessage.textContent = message;
    }

    // HTML에 표시할 문자열의 특수문자 처리
    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, function(character) {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };

        return entities[character];
      });
    }

    // 카카오맵 길찾기 주소 생성
    function createRouteUrl(place) {
      const destinationName = encodeURIComponent(place.place_name);
      const destinationLat = Number(place.y);
      const destinationLng = Number(place.x);

      const destination =
        destinationName + "," + destinationLat + "," + destinationLng;

      // 현재 위치가 있으면 출발지와 목적지를 함께 전달
      if (currentPosition) {
        const origin =
          encodeURIComponent("내 위치") + "," +
          currentPosition.getLat() + "," +
          currentPosition.getLng();

        return "https://map.kakao.com/link/from/" +
          origin + "/to/" + destination;
      }

      // 현재 위치가 없으면 목적지만 표시
      return "https://map.kakao.com/link/to/" + destination;
    }

    // 지도 초기화
    function initializeMap() {
      const defaultPosition = new kakao.maps.LatLng(
        37.5665,
        126.9780
      );

      // 서울 시청을 기본 지도 중심으로 사용
      map = new kakao.maps.Map(
        document.getElementById("map"),
        {
          center: defaultPosition,
          level: 5
        }
      );

      // 장소 검색 서비스 생성
      placesService = new kakao.maps.services.Places();

      // 장소 상세 정보 창 생성
      infoWindow = new kakao.maps.InfoWindow({
        zIndex: 5
      });

      // 지도 준비 완료 확인
      kakao.maps.event.addListener(map, "tilesloaded", function() {
        if (!isMapReady) {
          isMapReady = true;
          updateStatus("지도가 준비되었습니다.");
        }
      });

      // 현재 위치 확인 후 주변 병원 검색
      requestCurrentLocation();
    }

    // 현재 위치 요청
    function requestCurrentLocation() {
      if (!navigator.geolocation) {
        updateStatus(
          "위치 정보를 지원하지 않습니다. 지도에서 원하는 지역을 검색하세요."
        );

        searchNearbyPlaces();
        return;
      }

      updateStatus("현재 위치를 확인하고 있습니다.");

      navigator.geolocation.getCurrentPosition(
        function(position) {
          // 현재 위치 저장
          currentPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          // 지도 중심을 현재 위치로 이동
          map.setCenter(currentPosition);
          map.setLevel(4);

          // 현재 위치 마커 표시
          displayCurrentLocation();

          // 현재 위치 주변 의료시설 검색
          searchNearbyPlaces();
        },

        function(error) {
          // 위치 확인에 실패하면 기본 지도에서 검색
          let errorMessage = "현재 위치를 확인할 수 없습니다.";

          if (error.code === error.PERMISSION_DENIED) {
            errorMessage = "위치 권한이 거부되었습니다.";
          } else if (error.code === error.TIMEOUT) {
            errorMessage = "위치 확인 시간이 초과되었습니다.";
          }

          updateStatus(
            errorMessage + " 지도 중심을 기준으로 검색합니다."
          );

          searchNearbyPlaces();
        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    // 현재 위치 마커 표시
    function displayCurrentLocation() {
      if (!currentPosition) {
        return;
      }

      if (currentLocationMarker) {
        currentLocationMarker.setMap(null);
      }

      // 현재 위치를 파란색 원으로 표시
      const markerElement = document.createElement("div");
      markerElement.className = "current-marker";

      currentLocationMarker = new kakao.maps.CustomOverlay({
        position: currentPosition,
        content: markerElement,
        yAnchor: 0.5,
        zIndex: 10
      });

      currentLocationMarker.setMap(map);
    }

    // 현재 위치로 지도 이동
    function moveToCurrentLocation() {
      if (!currentPosition) {
        updateStatus(
          "현재 위치를 사용할 수 없습니다. 브라우저의 위치 권한을 확인하세요."
        );
        return;
      }

      map.setCenter(currentPosition);
      map.setLevel(4);

      searchNearbyPlaces();
    }

    // 기존 의료시설 마커 제거
    function clearMedicalMarkers() {
      medicalMarkers.forEach(function(marker) {
        marker.setMap(null);
      });

      medicalMarkers = [];

      if (infoWindow) {
        infoWindow.close();
      }
    }

    // 검색 목록 초기화
    function clearResults(message) {
      currentPlaces = [];
      resultList.innerHTML = "";

      resultCount.textContent = "0곳";

      const emptyMessage = document.createElement("div");
      emptyMessage.className = "empty-message";
      emptyMessage.textContent = message;

      resultList.appendChild(emptyMessage);
    }

    // 카테고리 변경
    function changeCategory(category) {
      if (!categoryConfig[category]) {
        return;
      }

      activeCategory = category;

      // 활성 탭 디자인 변경
      tabButtons.forEach(function(button) {
        const isActive = button.dataset.category === category;
        button.classList.toggle("active", isActive);
      });

      // 이전 검색 결과 초기화
      searchRequestId++;
      clearMedicalMarkers();
      clearResults("주변 의료시설을 검색하고 있습니다.");

      // 검색 제목 변경
      listTitle.textContent =
        "주변 " + categoryConfig[category].name;

      searchInput.value = "";

      // 새로운 카테고리 검색
      searchNearbyPlaces();
    }

    // 주변 의료시설 검색
    function searchNearbyPlaces() {
      if (!isMapReady || !placesService) {
        updateStatus("지도가 준비될 때까지 기다려 주세요.");
        return;
      }

      // 이전 비동기 검색 결과가 나중에 덮어쓰지 않도록 식별 번호 사용
      const requestId = ++searchRequestId;
      const config = categoryConfig[activeCategory];

      const searchCenter = currentPosition || map.getCenter();

      clearMedicalMarkers();
      clearResults("주변 " + config.name + "을(를) 검색하고 있습니다.");

      updateStatus(
        searchCenter === currentPosition
          ? "현재 위치 주변 " + config.name + "을(를) 검색합니다."
          : "지도 중심 주변 " + config.name + "을(를) 검색합니다."
      );

      // 카카오맵 의료시설 카테고리 검색
      placesService.categorySearch(
        config.code,
        function(data, status) {
          // 더 최근의 검색이 시작되었다면 이전 결과 무시
          if (requestId !== searchRequestId) {
            return;
          }

          if (status === kakao.maps.services.Status.OK) {
            currentPlaces = data;

            displayResults(data);
            displayMedicalMarkers(data);

            updateStatus(
              "주변 " + config.name + " " + data.length + "곳을 찾았습니다."
            );

          } else if (
            status === kakao.maps.services.Status.ZERO_RESULT
          ) {
            clearMedicalMarkers();
            clearResults("주변에 검색 결과가 없습니다.");

            updateStatus(
              "검색 결과가 없습니다. 다른 지역에서 확인해 보세요."
            );

          } else {
            clearMedicalMarkers();
            clearResults("검색에 실패했습니다. 다시 시도해 주세요.");

            updateStatus(
              "검색 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요."
            );
          }
        },
        {
          location: searchCenter,
          radius: 5000,
          sort: kakao.maps.services.SortBy.DISTANCE
        }
      );
    }

    // 키워드로 의료시설 검색
    function searchByKeyword(keyword) {
      if (!isMapReady || !placesService) {
        updateStatus("지도가 준비될 때까지 기다려 주세요.");
        return;
      }

      const trimmedKeyword = keyword.trim();

      if (!trimmedKeyword) {
        searchNearbyPlaces();
        return;
      }

      const requestId = ++searchRequestId;
      const config = categoryConfig[activeCategory];

      clearMedicalMarkers();
      clearResults("검색 중입니다.");

      searchButton.disabled = true;
      updateStatus("'" + trimmedKeyword + "' 검색 중입니다.");

      // 키워드 검색 후 선택한 카테고리에 맞는 결과만 남김
      placesService.keywordSearch(
        trimmedKeyword,
        function(data, status) {
          searchButton.disabled = false;

          if (requestId !== searchRequestId) {
            return;
          }

          if (status === kakao.maps.services.Status.OK) {
            const filteredPlaces = data.filter(function(place) {
              return place.category_group_code === config.code;
            });

            currentPlaces = filteredPlaces;

            if (filteredPlaces.length > 0) {
              displayResults(filteredPlaces);
              displayMedicalMarkers(filteredPlaces);

              updateStatus(
                "'" + trimmedKeyword + "' 검색 결과 " +
                filteredPlaces.length + "곳을 찾았습니다."
              );
            } else {
              clearMedicalMarkers();
              clearResults(
                "선택한 카테고리에 해당하는 결과가 없습니다."
              );

              updateStatus(
                "검색 결과가 없습니다. 다른 검색어를 입력해 보세요."
              );
            }

          } else if (
            status === kakao.maps.services.Status.ZERO_RESULT
          ) {
            clearMedicalMarkers();
            clearResults("검색 결과가 없습니다.");

            updateStatus("검색 결과가 없습니다.");

          } else {
            clearMedicalMarkers();
            clearResults("검색 중 오류가 발생했습니다.");

            updateStatus("검색 중 오류가 발생했습니다.");
          }
        },
        {
          location: currentPosition || map.getCenter(),
          radius: 20000,
          sort: kakao.maps.services.SortBy.DISTANCE
        }
      );
    }

    // 왼쪽 검색 결과 목록 표시
    function displayResults(places) {
      resultList.innerHTML = "";

      const config = categoryConfig[activeCategory];

      resultCount.textContent = places.length + "곳";

      if (places.length === 0) {
        clearResults("검색 결과가 없습니다.");
        return;
      }

      places.forEach(function(place, index) {
        const item = document.createElement("div");
        item.className = "result-item";

        // 의료시설 유형별 이미지 영역
        const image = document.createElement("div");
        image.className =
          "result-image " + config.markerClass;
        image.textContent = config.icon;
        image.setAttribute("aria-hidden", "true");

        const info = document.createElement("div");
        info.className = "result-info";

        const name = document.createElement("div");
        name.className = "result-name";
        name.textContent = (index + 1) + ". " + place.place_name;

        const category = document.createElement("div");
        category.className = "result-category";
        category.textContent =
          place.category_name || config.name;

        const address = document.createElement("div");
        address.className = "result-address";
        address.textContent =
          place.road_address_name ||
          place.address_name ||
          "주소 정보 없음";

        const phone = document.createElement("div");
        phone.className = "result-phone";
        phone.textContent =
          place.phone || "전화번호 정보 없음";

        info.appendChild(name);
        info.appendChild(category);
        info.appendChild(address);
        info.appendChild(phone);

        item.appendChild(image);
        item.appendChild(info);

        // 목록을 클릭하면 지도 이동 및 상세 정보 표시
        item.addEventListener("click", function() {
          document.querySelectorAll(".result-item").forEach(
            function(resultItem) {
              resultItem.classList.remove("selected");
            }
          );

          item.classList.add("selected");
          moveToPlace(place);
        });

        resultList.appendChild(item);
      });
    }

    // 의료시설별 지도 마커 생성
    function displayMedicalMarkers(places) {
      clearMedicalMarkers();

      const config = categoryConfig[activeCategory];

      places.forEach(function(place) {
        const position = new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        );

        // 병원과 약국의 마커 색상 및 아이콘 구분
        const markerElement = document.createElement("div");
        markerElement.className =
          "custom-marker " + config.markerClass;

        const markerIcon = document.createElement("span");
        markerIcon.textContent = config.icon;
        markerElement.appendChild(markerIcon);

        const marker = new kakao.maps.CustomOverlay({
          position: position,
          content: markerElement,
          yAnchor: 1,
          zIndex: 3
        });

        marker.setMap(map);

        // 마커를 클릭하면 상세 팝업 표시
        markerElement.style.cursor = "pointer";

        markerElement.addEventListener("click", function() {
          showPlaceDetails(place, marker);
        });

        medicalMarkers.push(marker);
      });

      // 현재 위치를 기준으로 지도 표시 영역 조정
      if (places.length > 0) {
        const bounds = new kakao.maps.LatLngBounds();

        places.forEach(function(place) {
          bounds.extend(
            new kakao.maps.LatLng(
              Number(place.y),
              Number(place.x)
            )
          );
        });

        if (currentPosition) {
          bounds.extend(currentPosition);
        }

        map.setBounds(bounds, 50, 50, 50, 50);
      }
    }

    // 의료시설 상세 팝업 표시
    function showPlaceDetails(place, marker) {
      const routeUrl = createRouteUrl(place);

      const address =
        place.road_address_name ||
        place.address_name ||
        "주소 정보 없음";

      const phone =
        place.phone || "전화번호 정보 없음";

      // HTML 삽입 시 장소 정보의 특수문자 처리
      const content =
        '<div style="padding:12px;width:240px;font-size:12px;line-height:1.7;">' +
          '<div style="font-size:15px;font-weight:bold;margin-bottom:7px;">' +
            escapeHTML(place.place_name) +
          '</div>' +
          '<div style="color:#666;margin-bottom:5px;">📍 ' +
            escapeHTML(address) +
          '</div>' +
          '<div style="color:#666;margin-bottom:10px;">☎ ' +
            escapeHTML(phone) +
          '</div>' +
          '<a href="' + escapeHTML(routeUrl) + '" target="_blank" ' +
            'rel="noopener noreferrer" ' +
            'style="display:block;padding:9px;background:#fee500;' +
            'border-radius:6px;text-align:center;color:#222;' +
            'text-decoration:none;font-weight:bold;">' +
            '카카오맵에서 길찾기' +
          '</a>' +
        '</div>';

      infoWindow.setContent(content);

      // CustomOverlay의 위치에 정보 창을 표시
      infoWindow.open(map);

      // 지도 중심을 해당 의료시설로 이동
      map.panTo(
        new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        )
      );
    }

    // 선택한 의료시설로 이동
    function moveToPlace(place) {
      const position = new kakao.maps.LatLng(
        Number(place.y),
        Number(place.x)
      );

      map.setLevel(3);
      map.panTo(position);

      // 선택된 의료시설의 상세 정보 표시
      showPlaceDetails(place, null);
    }

    // 탭 버튼 이벤트
    tabButtons.forEach(function(button) {
      button.addEventListener("click", function() {
        changeCategory(button.dataset.category);
      });
    });

    // 검색 폼 이벤트
    searchForm.addEventListener("submit", function(event) {
      event.preventDefault();

      searchByKeyword(searchInput.value);
    });

    // 현재 위치 버튼 이벤트
    locationButton.addEventListener("click", function() {
      moveToCurrentLocation();
    });

    // 카카오 지도 SDK 준비 후 지도 생성
    if (window.kakao && kakao.maps) {
      kakao.maps.load(function() {
        initializeMap();
      });
    } else {
      updateStatus(
        "카카오 지도 SDK를 불러오지 못했습니다. " +
        "API 키와 도메인 설정을 확인해 주세요."
      );

      clearResults("지도를 불러올 수 없습니다.");
    }
  </script>
</body>
</html>
